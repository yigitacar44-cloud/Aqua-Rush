<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Aqua Rush</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#55cdf1;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hide{display:none!important}.hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #075274}.top{display:flex;justify-content:space-between;padding:18px 14px;font-size:16px;font-weight:900}.pill{background:#164d66dd;border:2px solid #ffffff88;border-radius:18px;padding:7px 12px}.stats{position:absolute;top:62px;left:0;right:0;text-align:center}.stats b{font-size:30px}.stats small{display:block;font-size:16px}.hint{position:fixed;bottom:35px;left:0;right:0;text-align:center;color:#fff;font-weight:1000;text-shadow:0 2px 4px #075274}.power{position:fixed;bottom:70px;left:18%;right:18%;height:22px;border:3px solid white;border-radius:16px;overflow:hidden;background:#164d6688}.power i{height:100%;display:block;width:0;background:linear-gradient(90deg,#ffd82f,#ff6e21)}
.menu{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#59d4f4 0 46%,#0c9ece 46%);color:white}.island{position:absolute;left:-12%;right:-12%;top:34%;height:27%;background:#f8dd8b;border-radius:50% 50% 22% 20%;box-shadow:0 12px 0 #e9b957}.sun{position:absolute;width:82px;height:82px;border-radius:50%;background:#ffe56a;right:12%;top:10%;box-shadow:0 0 35px #fff49d}.palm{position:absolute;top:23%;font-size:92px;filter:drop-shadow(0 8px 3px #067a9c66)}.p1{left:3%;transform:rotate(-7deg)}.p2{right:2%;transform:scaleX(-1) rotate(-7deg)}.hero{position:absolute;top:18%;left:50%;transform:translateX(-50%);text-align:center}.hero .person{font-size:100px;filter:drop-shadow(0 7px 3px #07527466)}.logo{font-size:38px;font-weight:1000;line-height:.82;letter-spacing:2px;text-shadow:0 5px 0 #08789f;transform:rotate(-3deg);margin-top:-8px}.level{display:inline-block;margin-top:12px;background:#ff5962;border:3px solid white;border-radius:15px;padding:5px 18px;font-weight:1000}.side{position:absolute;top:48%;display:flex;flex-direction:column;gap:10px}.left{left:12px}.right{right:12px}.round{width:55px;height:55px;border:3px solid white;border-radius:16px;background:#118dc2;color:white;font-size:25px;box-shadow:0 5px 0 #075d86}.play{position:absolute;top:57%;left:50%;transform:translateX(-50%);border:0;border-radius:24px;background:#ffcf38;color:#164d66;padding:16px 55px;font-weight:1000;font-size:24px;box-shadow:0 7px 0 #dc8e16}.result{position:absolute;top:64%;left:0;right:0;text-align:center;font-weight:900;min-height:25px}.cards{position:absolute;left:10px;right:10px;bottom:max(20px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:#f7fcff;color:#154f6c;border:3px solid #b6efff;border-radius:15px;padding:9px 4px;text-align:center;box-shadow:0 5px 0 #08759e}.card em{display:block;font-style:normal;font-size:31px}.card b,.card small{display:block}.card button{border:0;border-radius:10px;background:#0d91c8;color:#fff;padding:7px 5px;margin-top:6px;font-weight:900;width:92%}
</style></head><body><canvas id="game"></canvas><div class="hud hide" id="hud"><div class="top"><span class="pill">🪙 <span id="coins">0</span></span><span class="pill">🏆 <span id="best">0</span> m</span></div><div class="stats"><b><span id="speed">0</span> km/h</b><small><span id="distance">0</span> m</small></div></div><div class="hint hide" id="hint">BASILI TUT • GÜCÜ AYARLA • BIRAK</div><div class="power hide" id="power"><i></i></div>
<main class="menu" id="menu"><div class="sun"></div><div class="island"></div><div class="palm p1">🌴</div><div class="palm p2">🌴</div><div class="hero"><div class="person">🧑‍🚀</div><div class="logo">AQUA<br>RUSH</div><span class="level">LEVEL <span id="level">1</span></span></div><div class="side left"><button class="round">📋</button><button class="round">🎁</button></div><div class="side right"><button class="round">⚙️</button><button class="round">🏆</button></div><button class="play" id="play">OYNA</button><div class="result" id="result"></div><div class="cards"><div class="card"><em>🚀</em><b>FIRLATICI</b><small>Seviye <span id="launchLv">1</span></small><button data-up="launch">🪙 <span>25</span></button></div><div class="card"><em>🛟</em><b>BOT</b><small>Seviye <span id="boatLv">1</span></small><button data-up="boat">🪙 <span>25</span></button></div><div class="card"><em>💰</em><b>KAZANÇ</b><small>Seviye <span id="incomeLv">1</span></small><button data-up="income">🪙 <span>25</span></button></div></div></main><script src="game.js"></script></body></html>
