<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#087fbd">
  
  <title>Aqua Rush</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#54c8ef;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 5px #064d6d}.top{display:flex;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 16px 0;font-weight:900;font-size:18px}.pill{background:#07577dcc;border:2px solid #fff8;border-radius:20px;padding:7px 13px}.center{position:absolute;top:80px;left:0;right:0;text-align:center;font-weight:900}.speed{font-size:34px}.distance{font-size:17px}.menu{position:fixed;inset:0;background:linear-gradient(#47c5ef,#0578b4);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:24px;text-align:center}.menu h1{font-size:52px;line-height:.9;margin:0;transform:rotate(-3deg);text-shadow:0 5px 0 #07587c}.menu p{font-weight:700;max-width:380px}.play{border:0;border-radius:24px;background:#ffcc36;color:#124c69;font-size:25px;font-weight:1000;padding:17px 48px;box-shadow:0 7px 0 #e48819}.upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(480px,100%);margin:26px 0}.card{background:#ffffffee;color:#145573;border-radius:16px;padding:12px 7px;border:3px solid #8be5ff}.card b{display:block}.card button{pointer-events:auto;margin-top:7px;border:0;border-radius:12px;padding:8px;background:#087fbd;color:#fff;font-weight:800}.result{font-size:18px;min-height:28px}.hint{position:fixed;bottom:max(28px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:white;font-size:18px;font-weight:900;text-shadow:0 2px 5px #064d6d;pointer-events:none}.hidden{display:none}.charge{position:fixed;bottom:90px;left:20%;right:20%;height:20px;border:3px solid white;border-radius:14px;overflow:hidden;background:#07577d88}.charge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe340,#ff6b26)}
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud hidden" id="hud"><div class="top"><span class="pill">🪙 <span id="coins">0</span></span><span class="pill">🏆 <span id="best">0</span> m</span></div><div class="center"><div class="speed"><span id="speed">0</span> km/h</div><div class="distance"><span id="distance">0</span> m</div></div></div>
<div class="hint hidden" id="hint">BASILI TUT • GÜCÜ AYARLA • BIRAK</div><div class="charge hidden" id="charge"><i></i></div>
<main class="menu" id="menu"><h1>AQUA<br>RUSH</h1><p>Şişme botu fırlat, dalgaları aş ve mümkün olduğunca uzağa git!</p><div class="result" id="result"></div><div class="upgrades"><div class="card">🚀<b>Fırlatıcı</b><small>Seviye <span id="launchLv">1</span></small><button data-up="launch">🪙 <span>25</span></button></div><div class="card">🛟<b>Bot</b><small>Seviye <span id="boatLv">1</span></small><button data-up="boat">🪙 <span>25</span></button></div><div class="card">💰<b>Kazanç</b><small>Seviye <span id="incomeLv">1</span></small><button data-up="income">🪙 <span>25</span></button></div></div><button class="play" id="play">OYNA</button><p style="font-size:13px;opacity:.85">Oyunda sağa-sola sürükleyerek yön ver.</p></main>
<script src="game.js"></script>
</body></html>
