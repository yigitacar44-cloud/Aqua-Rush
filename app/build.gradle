plugins { id 'com.android.application' }

android {
    namespace 'com.somnyralab.zombiedefense'
    compileSdk 35

    defaultConfig {
        applicationId 'com.somnyralab.zombiedefense'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '2.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
