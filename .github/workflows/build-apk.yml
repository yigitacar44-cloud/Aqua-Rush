name: Build Aqua Rush 3D APK
on:
  push:
    branches: [codex/android-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot Android export
        working-directory: godot
        run: |
          mkdir -p build/android
          mkdir -p /github/home/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/templates/4.3.stable /github/home/.local/share/godot/export_templates/4.3.stable
          mkdir -p /github/home/.android
          keytool -genkeypair -v -keystore /github/home/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Aqua Rush,O=Somnyra,C=TR"
      - name: Export Android APK
        working-directory: godot
        run: godot --headless --verbose --export-debug "Android" build/android/Aqua-Rush-3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aqua-Rush-3D-APK
          path: godot/build/android/Aqua-Rush-3D.apk
