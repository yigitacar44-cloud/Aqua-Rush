name: Build Aqua Rush 3D APK
on:
  push:
    branches: [codex/android-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:
env:
  GODOT_VERSION: 4.4
jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Export Android APK
        run: |
          mkdir -p build/android
          EXPORT_DIR="$(readlink -f build)"
          cd godot
          godot --headless --editor --quit
          godot --headless --quit-after 5
          godot --headless --verbose --export-debug "Android" "$EXPORT_DIR/android/Aqua-Rush-3D.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Aqua-Rush-3D-APK
          path: build/android/Aqua-Rush-3D.apk
