name: Build Aqua Rush 3D APK
on:
  push:
    branches: [codex/android-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare export
        working-directory: godot
        run: mkdir -p build/android
      - name: Export Android APK
        working-directory: godot
        run: godot --headless --verbose --export-debug "Android" build/android/Aqua-Rush-3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aqua-Rush-3D-APK
          path: godot/build/android/Aqua-Rush-3D.apk
